name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if (Test-Path -Path requirements.txt) { pip install -r requirements.txt }
        shell: pwsh

      - name: Run py_compile
        run: python -m py_compile $(Get-ChildItem -Recurse -Filter *.py -Exclude __pycache__ | Resolve-Path -Relative)
        shell: pwsh

      - name: Run pytest
        run: pytest -v
        shell: pwsh
